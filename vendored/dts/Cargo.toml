description = "Pure-Rust DTS audio decoder and Core encoder (Core profile, with EXSS/XCH/XXCH/X96/XLL extensions planned) for the oxideav framework"
homepage = "https://github.com/OxideAV/oxideav-dts"
readme = "README.md"
keywords = [
    "multimedia",
    "audio",
    "dts",
    "dca",
    "codec",
]
categories = [
    "multimedia::encoding",
    "multimedia::audio",
]
license = "MIT"
repository = "https://github.com/OxideAV/oxideav-dts"

[features]
# AudioCommander vendoring: the optional `oxideav-core` registry surface
# (a crates.io dependency) is deliberately NOT vendored — the app drives
# the codec directly through src/ffi.rs. The feature name stays declared
# so the upstream `#[cfg(feature = "registry")]` gates stay check-cfg
# clean, and the four registry integration tests are gated behind it via
# required-features below. Enabling it here will NOT compile (no dep).
default = []
registry = []

[lib]
name = "oxideav_dts"
path = "src/lib.rs"
# Also emitted as a C static library so the vendored decoders.c can drive it
# through the thin `ffi` module (see src/ffi.rs). The rlib keeps `cargo test`
# working for the upstream unit tests. Built with
# `cargo build --release --offline --no-default-features` (the optional
# `registry` feature pulls oxideav-core from crates.io and is not needed).
crate-type = ["staticlib", "rlib"]

